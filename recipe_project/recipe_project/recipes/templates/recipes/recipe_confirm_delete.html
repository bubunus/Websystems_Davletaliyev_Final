{% extends 'recipes/base.html' %}
{% block title %}Delete Recipe - RecipeBook{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card text-center">
        <div class="card-body p-5">
            <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
            <h4 class="fw-bold">Delete Recipe?</h4>
            <p class="text-muted">Are you sure you want to delete <strong>"{{ recipe.title }}"</strong>? This cannot be undone.</p>
            <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-1"></i>Yes, Delete</button>
                <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
